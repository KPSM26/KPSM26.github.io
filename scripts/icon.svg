<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Rounded square background — muted sage green -->
  <rect width="1024" height="1024" rx="220" fill="#4F7349"/>

  <!-- Subtle inner glow layer -->
  <rect x="60" y="60" width="904" height="904" rx="170" fill="white" fill-opacity="0.04"/>

  <!-- Three staggered time-block bars representing a scheduled day -->
  <!-- Bar 1: full width — main task -->
  <rect x="200" y="298" width="624" height="88" rx="24" fill="white" fill-opacity="0.95"/>

  <!-- Bar 2: medium — second block -->
  <rect x="200" y="458" width="420" height="88" rx="24" fill="white" fill-opacity="0.65"/>

  <!-- Bar 3: short — third block -->
  <rect x="200" y="618" width="280" height="88" rx="24" fill="white" fill-opacity="0.38"/>

  <!-- Small dot — completion / status indicator on bar 1 -->
  <circle cx="164" cy="342" r="22" fill="white" fill-opacity="0.90"/>
</svg>
